{% extends 'base.html' %}

{% block title %}Edit profile{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px;">
  <div class="card-header">
    <div>
      <h1 class="card-title">Edit profile</h1>
      <p class="card-subtitle">Update your profile information</p>
    </div>
  </div>

  <form method="post" enctype="multipart/form-data" class="stack">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" value="{{ profile.name }}" required />
    </div>
    <div class="field-row two">
      <div class="field">
        <label for="role">Role</label>
        <input type="text" name="role" id="role" value="{{ profile.role }}" />
      </div>
      <div class="field">
        <label for="contact">Contact</label>
        <input type="text" name="contact" id="contact" value="{{ profile.contact }}" />
      </div>
    </div>
    <div class="field">
      <label for="bio">Bio</label>
      <textarea name="bio" id="bio" rows="4">{{ profile.bio }}</textarea>
    </div>
    <div class="field">
      <label for="photo">Selfie photo</label>
      <input type="file" name="photo" id="photo" accept="image/*" />
      <small class="helper">JPG, PNG, WebP. Max {{ max_upload_mb }} MB.</small>
    </div>
    <div class="actions"><button type="submit" class="btn btn-primary">Save profile</button></div>
  </form>
</div>
{% endblock %}
