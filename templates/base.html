<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Field Diary{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div>
      <p class="kicker">Archaeological Field Diary</p>
      <h1>Na Picu Napad Jirky</h1>
    </div>
    <nav>
      <a href="{{ url_for('index') }}">Entries</a>
      <a href="{{ url_for('new_entry') }}">New entry</a>
      <a href="{{ url_for('manage_users') }}">Team</a>
      <a href="{{ url_for('manage_people') }}">Finders</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
