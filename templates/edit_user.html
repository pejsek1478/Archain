{% extends 'base.html' %}

{% block title %}Edit team member{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px;">
  <div class="card-header">
    <div>
      <h1 class="card-title">Edit team member</h1>
      <p class="card-subtitle">Modify user account details</p>
    </div>
  </div>

  <form method="post" class="stack">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" value="{{ user.name }}" required />
    </div>
    <div class="field">
      <label for="password">New password</label>
      <div class="input-group">
        <input type="password" name="password" id="password" placeholder="Leave blank to keep current" autocomplete="new-password" />
        <button type="button" class="btn btn-ghost btn-sm" onclick="togglePassword(this)" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <small class="helper">Leave blank to keep current password</small>
    </div>
    <div class="field-row two">
      <div class="field">
        <label for="role">Role</label>
        <input type="text" name="role" id="role" value="{{ user.role }}" />
      </div>
      <div class="field">
        <label for="contact">Contact</label>
        <input type="text" name="contact" id="contact" value="{{ user.contact }}" />
      </div>
    </div>
    <div class="field">
      <label style="display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer;">
        <input type="checkbox" name="is_admin" {% if user.is_admin %}checked{% endif %} />
        <span>Admin access</span>
      </label>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a class="btn btn-ghost btn-sm" href="{{ url_for('manage_users') }}">Cancel</a>
    </div>
  </form>
</div>

<script>
  function togglePassword(btn) {
    const input = btn.parentElement.querySelector('input[type="password"], input[type="text"]');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    btn.innerHTML = isPassword
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
</script>
{% endblock %}
