{% extends 'base.html' %}

{% block content %}
<div class="card" style="margin-bottom: 24px;">
  <div class="card-header">
    <div>
      <h1 class="card-title">Entry map</h1>
      <p class="card-subtitle">View every entry shared with you on a single map. Entries without coordinates are hidden.</p>
    </div>
  </div>
</div>

<div class="card" style="padding: 0; overflow: hidden;">
  <div id="entry-map" class="map-frame" style="height: 560px; border-radius: 0;"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const entries = [
    {% for entry in entries %}
      { id: {{ entry.id }}, title: {{ entry.title|tojson }}, lat: {{ entry.latitude }}, lon: {{ entry.longitude }}, time: {{ (entry.event_time or entry.created_at).strftime('%Y-%m-%d %H:%M')|tojson }}{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  const map = L.map('entry-map');
  if (entries.length) { map.setView([entries[0].lat, entries[0].lon], 6); }
  else { map.setView([20, 0], 2); }

  function escapeHtml(v) { return String(v).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c])); }

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

  entries.forEach(e => {
    const marker = L.marker([e.lat, e.lon]).addTo(map);
    marker.bindPopup(`<strong>${escapeHtml(e.title)}</strong><br />${escapeHtml(e.time)}<br /><a href="/entries/${e.id}">Open entry</a>`);
  });

  if (entries.length > 1) {
    map.fitBounds(entries.map(e => [e.lat, e.lon]), { padding: [40, 40], maxZoom: 15 });
  }
</script>
{% endblock %}
