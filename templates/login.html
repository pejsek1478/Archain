{% extends 'base.html' %}

{% block content %}
<div class="card auth-card">
  <div style="text-align: center; margin-bottom: 24px;">
    <div class="avatar avatar-lg" style="margin: 0 auto 16px;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M12 3v18M3 12h18M12 3a9 9 0 0 1 9 9v0a9 9 0 0 1-9 9H3a9 9 0 0 1-9-9v0a9 9 0 0 1 9-9z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <h1 style="font-size: 26px; font-weight: 700;">Sign in</h1>
    <p class="muted">Enter your credentials to access the diary</p>
  </div>

  <form method="post" class="stack">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" required autofocus autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-group">
        <input type="password" name="password" id="password" required autocomplete="current-password" />
        <button type="button" class="btn btn-ghost btn-sm" onclick="togglePassword(this)" aria-label="Toggle password visibility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="actions"><button type="submit" class="btn btn-primary" style="width: 100%;">Sign in</button></div>
  </form>

  <p class="helper" style="margin-top: 20px; text-align: center;">First time? <a href="{{ url_for('setup') }}">Create owner account</a>.</p>
</div>

<script>
  function togglePassword(btn) {
    const input = btn.parentElement.querySelector('input[type="password"], input[type="text"]');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    btn.innerHTML = isPassword
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
</script>
{% endblock %}
